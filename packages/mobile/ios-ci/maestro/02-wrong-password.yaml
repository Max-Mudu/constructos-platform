# A wrong password is rejected by the API on this runner and the app shows the
# API's own message (not the "Cannot reach the server" fallback).
appId: com.constructos.app
---
- launchApp
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 90000
# The fields are matched by their placeholders: each is unique on the screen,
# while "Work email" and "Password" also match the labels above the fields.
- runFlow:
    file: subflows/enter-credentials.yaml
    env:
      EMAIL: ${SMOKE_EMAIL}
      PASSWORD: "Wrong-password-1"
      PW_LEN: "16"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Login Failed"
    timeout: 30000
- takeScreenshot: 02-wrong-password
- assertVisible: "Invalid email or password"
- tapOn: "OK"
# The login screen stays behind the dialog, so check the dialog closed.
- extendedWaitUntil:
    notVisible: "Invalid email or password"
    timeout: 15000
- assertVisible: "Welcome back"
