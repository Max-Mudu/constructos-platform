# Token refresh after expiry, then logout. Runs more than 2 minutes after
# 09a, with the app left open: the access token from the sign-in has expired
# (they live 2 minutes in this phase). Meanwhile smoke.sh created a delivery
# from "After Expiry Supplies" through the API, so that name can only be on
# screen if the app loaded data after the expiry, which needs a refreshed
# token. Then the supervisor logs out, the app is restarted and must stay on
# the login screen.
# smoke.sh checks the API log afterwards, by status codes only: a 401, then
# POST /auth/refresh 200, then POST /auth/logout 200.
#
# Fails if: the app was signed out during the wait, the delivery created
# after the expiry never appears, logout does not reach the login screen, or
# the restarted app shows the tabs again.
#
# Deliveries tab (run 44600462458): the first tap came 4 s after the flow
# started; UIKit delivered the touch, the test driver saw the screen change,
# but the app stayed on Home and requested no deliveries. Cause not
# established (one time in three). So the flow now waits for the Home
# screen's own content before tapping and, if Deliveries has not opened 15 s
# after the tap, records it (screenshot 09b-tab-retry-1-*) and taps once more
# (screenshot 09b-tab-retry-2-* if that worked). smoke.sh prints a
# "TAB RETRY 09b" line either way, so a retry never passes unnoticed; if the
# retry does not open Deliveries either, the flow fails.
appId: com.constructos.app
---
- assertVisible: "Home, tab.*"
- extendedWaitUntil:
    visible: "My Day"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "Deliveries, tab.*"
# The Deliveries screen is rendered once its search field shows.
- extendedWaitUntil:
    visible: "Search supplier..."
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: "Search supplier..."
    commands:
      - takeScreenshot: 09b-tab-retry-1-first-tap-not-acted-on
      - tapOn: "Deliveries, tab.*"
      - extendedWaitUntil:
          visible: "Search supplier..."
          timeout: 15000
      - takeScreenshot: 09b-tab-retry-2-retry-opened-deliveries
- extendedWaitUntil:
    visible: ".*Bamburi Cement Ltd.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*After Expiry Supplies.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: session-03-data-loaded-after-expiry
- tapOn: "Profile, tab.*"
- extendedWaitUntil:
    visible: ${SUP_EMAIL}
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Log Out"
    direction: DOWN
- tapOn: "Log Out"
- extendedWaitUntil:
    visible: "Are you sure you want to log out\\?"
    timeout: 15000
# See flow 03 for why both relative selectors are needed.
- tapOn:
    text: "Log Out"
    rightOf: "Cancel"
    below: "Are you sure you want to log out\\?"
- extendedWaitUntil:
    notVisible: "Are you sure you want to log out\\?"
    timeout: 15000
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- takeScreenshot: session-04-logged-out
# Stop and start the app: nothing may bring the session back.
- launchApp
- extendedWaitUntil:
    visible: "(Welcome back|Home, tab.*)"
    timeout: 90000
- assertVisible: "Welcome back"
- assertNotVisible: "Home, tab.*"
- takeScreenshot: session-05-restarted-still-logged-out
