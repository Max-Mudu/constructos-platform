# Types an e-mail and a password into the login form and checks both before
# returning. Maestro types on iOS one key at a time, and the simulator has
# dropped keys: run 44285338082 sent "i" and "ici-...@example.com" for
# "ios-ci-...@example.com" (API 422 "Validation failed"). Each field is
# re-typed up to twice if it does not hold the full value, then asserted, so
# a dropped key can no longer turn into a misleading login failure.
# Env: EMAIL, PASSWORD, PW_LEN (number of characters in PASSWORD; a secure
# field shows one bullet per character and nothing else).
appId: com.constructos.app
---
- tapOn: "you@company.com"
- inputText: ${EMAIL}
- runFlow:
    when:
      notVisible: ${EMAIL}
    commands:
      - eraseText: 100
      - inputText: ${EMAIL}
- runFlow:
    when:
      notVisible: ${EMAIL}
    commands:
      - eraseText: 100
      - inputText: ${EMAIL}
- assertVisible: ${EMAIL}

- tapOn: "••••••••"
- inputText: ${PASSWORD}
- runFlow:
    when:
      notVisible: "•{${PW_LEN}}"
    commands:
      - eraseText: 100
      - inputText: ${PASSWORD}
- runFlow:
    when:
      notVisible: "•{${PW_LEN}}"
    commands:
      - eraseText: 100
      - inputText: ${PASSWORD}
- assertVisible: "•{${PW_LEN}}"
- pressKey: Enter
