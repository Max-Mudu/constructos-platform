# Types an e-mail and a password into the login form and checks both before
# returning. Maestro types on iOS one key at a time, and the simulator has
# dropped keys: run 44285338082 sent "i" and "ici-...@example.com" for
# "ios-ci-...@example.com" (API 422 "Validation failed"). Each field is
# re-typed up to twice if it does not hold the full value, then asserted, so
# a dropped key can no longer turn into a misleading login failure.
# Env: EMAIL, PASSWORD, PW_MASK (one bullet per character of PASSWORD: a secure
# field shows exactly that and nothing else. Passed as a literal because
# Maestro parses "${...}" inside a regex quantifier such as "•{${N}}" as
# script and fails, run 44294500145).
appId: com.constructos.app
---
- tapOn: "you@company.com"
- inputText: ${EMAIL}
- runFlow:
    when:
      notVisible: ${EMAIL}
    commands:
      - eraseText: 100
      - inputText: ${EMAIL}
- runFlow:
    when:
      notVisible: ${EMAIL}
    commands:
      - eraseText: 100
      - inputText: ${EMAIL}
- assertVisible: ${EMAIL}

- tapOn: "••••••••"
- inputText: ${PASSWORD}
- runFlow:
    when:
      notVisible: ${PW_MASK}
    commands:
      - eraseText: 100
      - inputText: ${PASSWORD}
- runFlow:
    when:
      notVisible: ${PW_MASK}
    commands:
      - eraseText: 100
      - inputText: ${PASSWORD}
- assertVisible: ${PW_MASK}
- pressKey: Enter
