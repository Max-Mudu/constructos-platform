# Types an e-mail and a password into the login form and checks both before
# returning. Maestro types on iOS one key at a time, and the simulator has
# dropped keys: run 44285338082 sent "i" and "ici-...@example.com" for
# "ios-ci-...@example.com" (API 422 "Validation failed"). Each field is
# re-typed up to twice if it does not hold the full value, then asserted, so
# a dropped key can no longer turn into a misleading login failure.
# Env: EMAIL, PASSWORD. A secure field shows one bullet per character and
# nothing else (login hierarchy of run 44285338082), so the expected text is
# built from the length of the password. A regex quantifier with a variable
# inside its braces does not work: Maestro reads up to the last closing brace
# as script and fails (run 44294500145).
appId: com.constructos.app
---
- tapOn: "you@company.com"
- inputText: ${EMAIL}
- runFlow:
    when:
      notVisible: ${EMAIL}
    commands:
      - eraseText: 100
      - inputText: ${EMAIL}
- runFlow:
    when:
      notVisible: ${EMAIL}
    commands:
      - eraseText: 100
      - inputText: ${EMAIL}
- assertVisible: ${EMAIL}

- tapOn: "••••••••"
- inputText: ${PASSWORD}
- runFlow:
    when:
      notVisible: "${'•'.repeat(PASSWORD.length)}"
    commands:
      - eraseText: 100
      - inputText: ${PASSWORD}
- runFlow:
    when:
      notVisible: "${'•'.repeat(PASSWORD.length)}"
    commands:
      - eraseText: 100
      - inputText: ${PASSWORD}
- assertVisible: "${'•'.repeat(PASSWORD.length)}"
- pressKey: Enter
