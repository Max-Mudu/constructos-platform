# Simulated push while the app is in the background: the flow sends the app
# to the background with the Home button, and smoke.sh keeps sending
# `xcrun simctl push` with data.entityType = "attendance". Tapping the banner
# must bring the app back on the Attendance screen (tap routing in
# app/_layout.tsx). Same simulator limits as 10a.
#
# Fails if: no tap on the banner position ever brings the app back on the
# Attendance screen.
appId: com.constructos.app
---
- runFlow:
    file: subflows/ensure-signed-in.yaml
    env:
      EMAIL: ${SUP_EMAIL}
      PASSWORD: ${SMOKE_PASSWORD}
      TAB: "Home, tab.*"
- tapOn: "Home, tab.*"
- pressKey: Home
- repeat:
    while:
      notVisible: ".*Mark Attendance.*"
    times: 30
    commands:
      - tapOn:
          point: "50%,9%"
- assertVisible: ".*Mark Attendance.*"
- assertVisible: "Attendance, tab.*"
- takeScreenshot: push-03-background-tap-opened-attendance
