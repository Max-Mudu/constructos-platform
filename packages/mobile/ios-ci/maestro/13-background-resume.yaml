# Background and foreground recovery. Before this flow (sessions suite) the
# site supervisor signed in and the app was restarted (flow 09a, API issuing
# 2-minute access tokens). smoke.sh then created a delivery from "After
# Background Supplies" through the API, sent the app to the background for
# 140 s (its access token expired meanwhile) and brought it back.
# The app must come back where it was, still signed in, and load the new
# delivery, which needs a refreshed token. No launchApp here: the process
# that went to the background is the one checked (smoke.sh compares the pid
# and reads the API log for a 401 followed by a successful refresh).
#
# Deliveries tab: same single documented retry of the first tap as flow 09b.
appId: com.constructos.app
---
- extendedWaitUntil:
    visible: "(Home, tab.*|Welcome back)"
    timeout: 30000
- assertVisible: "Home, tab.*"
- assertNotVisible: "Welcome back"
- extendedWaitUntil:
    visible: "My Day"
    timeout: 30000
- takeScreenshot: bg-01-back-in-foreground
- waitForAnimationToEnd
- tapOn: "Deliveries, tab.*"
- extendedWaitUntil:
    visible: "Search supplier..."
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: "Search supplier..."
    commands:
      - takeScreenshot: 13-tab-retry-1-first-tap-not-acted-on
      - tapOn: "Deliveries, tab.*"
      - extendedWaitUntil:
          visible: "Search supplier..."
          timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*After Background Supplies.*"
    direction: DOWN
    timeout: 30000
- assertNotVisible: "Welcome back"
- takeScreenshot: bg-02-data-after-resume
