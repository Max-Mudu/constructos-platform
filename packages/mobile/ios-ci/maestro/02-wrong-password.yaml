# A wrong password is rejected by the API on this runner and the app shows the
# API's own message (not the "Cannot reach the server" fallback).
appId: com.constructos.app
---
- launchApp
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 90000
- tapOn: "Work email"
- inputText: ${SMOKE_EMAIL}
- tapOn:
    text: "Password"
    below: "Forgot password\\?"
- inputText: "Wrong-password-1"
- pressKey: Enter
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Login Failed"
    timeout: 30000
- takeScreenshot: 02-wrong-password
- assertVisible: "Invalid email or password"
- tapOn: "OK"
- assertVisible: "Welcome back"
