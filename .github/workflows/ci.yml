name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No engines field or .nvmrc in the repo; the lockfile was produced with
# Node 24 / npm 11 (current Active LTS).
env:
  NODE_VERSION: '24'

jobs:
  api:
    name: API (tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construction_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only dummy values for a throwaway CI database. Not real secrets.
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/construction_platform_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/construction_platform_test?schema=public
      JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret-0000
      JWT_REFRESH_SECRET: ci-dummy-refresh-secret-not-a-real-secret-00
      STORAGE_DRIVER: local
      DAILY_REPORT_AI_PROVIDER: fake
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type-check
        run: npx tsc --noEmit -p .
      # Tests run against the schema the migrations build, which is what
      # production gets from `prisma migrate deploy`. The migrations job below
      # fails if that schema differs from schema.prisma.
      - name: Apply migrations to the CI test database
        run: npx prisma migrate deploy
      - name: Test
        run: npx jest --ci --runInBand --forceExit

  migrations:
    name: API migrations match schema.prisma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construction_platform_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database. Not a real secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/construction_platform_migrations?schema=public
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Apply all migrations to an empty database
        run: npx prisma migrate deploy
      # Production runs `prisma migrate deploy`, so anything in schema.prisma
      # that no migration creates is missing in a freshly deployed database.
      # Exit code 2 = drift; the SQL printed is what a new migration must add.
      - name: Fail if the migrated database differs from schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script --exit-code

  web:
    name: Web (tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Test
        run: npx jest --ci

  web-build:
    name: Web (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # NODE_ENV stays unset here: with NODE_ENV=production `npm ci` would skip
      # the devDependencies (typescript, tailwind, ...) that the build needs.
      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund
      # Next's incremental build cache. Every run restores the newest entry for
      # this lockfile; only pushes to main save one, so PR runs reuse main's
      # cache without each PR adding its own copy to the repo's cache quota.
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('packages/web/src/**', 'packages/web/*.js', 'packages/web/*.ts', 'packages/web/tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build
        env:
          # A production build is what gets deployed, and prerendering fails
          # under NODE_ENV=development.
          NODE_ENV: production
          # Build-time placeholder for the /api/v1 rewrite target. Not a secret.
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npx next build
      - name: Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

  mobile:
    name: Mobile (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit -p .
